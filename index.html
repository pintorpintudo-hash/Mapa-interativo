<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mapa Interativo</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* Zera margens e define a fonte */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; overflow: hidden; }

    /* LAYOUT CELULAR (Padrão) */
    #map {
      width: 100vw;
      height: calc(100vh - 140px);
      background-color: #ffffff;
    }
    
    #sidebar {
      width: 100vw;
      height: 140px;
      background: #ffffff;
      border-top: 2px solid #ccc;
      overflow-y: auto;
      position: absolute;
      bottom: 0;
      left: 0;
      z-index: 1000;
    }

    /* LAYOUT COMPUTADOR */
    @media (min-width: 768px) {
      #sidebar {
        width: 300px;
        height: 100vh;
        border-top: none;
        border-right: 2px solid #ccc;
        position: absolute;
        top: 0;
        left: 0;
      }
      #map {
        width: calc(100vw - 300px);
        height: 100vh;
        position: absolute;
        top: 0;
        right: 0;
      }
    }

    .sidebar-header {
      padding: 10px;
      background: #2c3e50;
      color: white;
      font-weight: bold;
      font-size: 14px;
      position: sticky;
      top: 0;
      text-align: center;
    }

    .item-marcacao {
      display: flex;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .item-marcacao:hover { background-color: #f9f9f9; }
    
    .item-marcacao img {
      width: 28px;
      height: 28px;
      margin-right: 12px;
      object-fit: contain;
    }
    
    .item-info { flex: 1; }
    .item-titulo { font-weight: bold; font-size: 13px; color: #333; }
    .item-sub { font-size: 11px; color: #666; margin-top: 2px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">Registros no Mapa</div>
    <div id="lista-marcacoes"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    // NOMES DAS IMAGENS DOS ÍCONES QUE DEVEM ESTAR NO SEU GITHUB:
    // - mapa.png (Imagem de fundo do mapa em 3510x2480px)
    // - acidente-eletrico.png
    // - aluguel.png
    // - buraco.png
    // - cabelereiro.png
    // - calcada-torta.png
    // - comercio.png
    // - dengue.png
    // - faixa-de-pedestre.png
    // - igreja.png
    // - ponto-de-onibus.png

    // 1. DICIONÁRIO EM ORDEM ALFABÉTICA
    const CATEGORIAS = {
      "1": { nome: "Acidente Elétrico", arquivo: "acidente-eletrico.png" },
      "2": { nome: "Aluguel", arquivo: "aluguel.png" },
      "3": { nome: "Buraco", arquivo: "buraco.png" },
      "4": { nome: "Cabeleireiro", arquivo: "cabelereiro.png" },
      "5": { nome: "Calçada Torta", arquivo: "calcada-torta.png" },
      "6": { nome: "Comércio", arquivo: "comercio.png" },
      "7": { nome: "Dengue", arquivo: "dengue.png" },
      "8": { nome: "Faixa de Pedestre", arquivo: "faixa-de-pedestre.png" },
      "9": { nome: "Igreja", arquivo: "igreja.png" },
      "10": { nome: "Ponto de Ônibus", arquivo: "ponto-de-onibus.png" }
    };

    const firebaseConfig = {
      apiKey: "AIzaSyB1YIrtkBJWjeEGAkdZ7g3jpTo642P61gM",
      authDomain: "mapa-interativo-odonto.firebaseapp.com",
      databaseURL: "https://mapa-interativo-odonto-default-rtdb.firebaseio.com",
      projectId: "mapa-interativo-odonto",
      storageBucket: "mapa-interativo-odonto.firebasestorage.app",
      messagingSenderId: "336573426093",
      appId: "1:336573426093:web:c5bf663dc02df19869d924",
      measurementId: "G-B811VWMKXB"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const marcacoesRef = database.ref('marcacoes');

    const map = L.map('map', { 
      crs: L.CRS.Simple, 
      minZoom: -2,
      maxBoundsViscosity: 1.0
    });
    
    const limites = [[0, 0], [2480, 3510]];
    map.setMaxBounds(limites);
    L.imageOverlay('mapa.png', limites).addTo(map);
    map.fitBounds(limites);

    function criarIcone(caminhoPng) {
      return L.icon({
        iconUrl: caminhoPng,
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });
    }

    map.on('click', function(e) {
      const autor = prompt("Qual o seu nome?");
      if (!autor) return;

      const menuTexto = 
        "Escolha o NÚMERO da categoria:\n\n" +
        "1 - Acidente Elétrico\n" +
        "2 - Aluguel\n" +
        "3 - Buraco\n" +
        "4 - Cabeleireiro\n" +
        "5 - Calçada Torta\n" +
        "6 - Comércio\n" +
        "7 - Dengue\n" +
        "8 - Faixa de Pedestre\n" +
        "9 - Igreja\n" +
        "10 - Ponto de Ônibus";

      const opcao = prompt(menuTexto, "1");
      if (!CATEGORIAS[opcao]) {
        alert("Opção inválida! Marcação cancelada.");
        return;
      }

      const descricao = prompt("Digite uma descrição curta:");
      if (!descricao) return;

      marcacoesRef.push({
        lat: e.latlng.lat,
        lng: e.latlng.lng,
        autor: autor,
        categoriaId: opcao,
        descricao: descricao
      });
    });

    const marcadoresLocais = {};

    marcacoesRef.on('child_added', function(snapshot) {
      const id = snapshot.key;
      const data = snapshot.val();
      
      const categoria = CATEGORIAS[data.categoriaId] || CATEGORIAS["1"];
      const caminhoImagem = categoria.arquivo;

      const marker = L.marker([data.lat, data.lng], {
        icon: criarIcone(caminhoImagem)
      }).addTo(map);

      marker.bindPopup(`
        <div style="text-align: center;">
          <img src="${caminhoImagem}" style="width:30px; height:30px;"><br>
          <b>${categoria.nome}</b><br>
          ${data.descricao}<br>
          <small>Por: ${data.autor}</small><br><br>
          <button onclick="removerMarcação('${id}')" style="color:red; cursor:pointer;">Excluir</button>
        </div>
      `);

      marcadoresLocais[id] = marker;

      const item = document.createElement('div');
      item.className = 'item-marcacao';
      item.id = 'item-' + id;
      item.innerHTML = `
        <img src="${caminhoImagem}" alt="${categoria.nome}">
        <div class="item-info">
          <div class="item-titulo">${categoria.nome}: ${data.descricao}</div>
          <div class="item-sub">Por ${data.autor}</div>
        </div>
      `;

      item.onclick = function() {
        map.setView([data.lat, data.lng], 0);
        marker.openPopup();
      };

      document.getElementById('lista-marcacoes').appendChild(item);
    });

    marcacoesRef.on('child_removed', function(snapshot) {
      const id = snapshot.key;
      if (marcadoresLocais[id]) {
        map.removeLayer(marcadoresLocais[id]);
        delete marcadoresLocais[id];
      }
      const itemElem = document.getElementById('item-' + id);
      if (itemElem) itemElem.remove();
    });

    window.removerMarcação = function(id) {
      if (confirm("Tem certeza que deseja apagar?")) {
        database.ref('marcacoes/' + id).remove();
      }
    };
  </script>
</body>
</html>
